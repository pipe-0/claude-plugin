name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository checks
        run: node scripts/validate.mjs
      - name: Claude Code plugin validation
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate .claude-plugin/marketplace.json --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate skills --strict
